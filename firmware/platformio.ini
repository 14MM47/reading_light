; Moon reading light firmware. PlatformIO + megaTinyCore (Arduino), ATtiny3216 at 10 MHz.
; Build:  pio run            Flash (SerialUPDI on /dev/ttyUSB0):  pio run -t upload
; Host unit tests of the light logic:  pio test -e native
[platformio]
default_envs = attiny3216

[env:attiny3216]
platform = atmelmegaavr
board = ATtiny3216
framework = arduino
board_build.f_cpu = 10000000L
board_hardware.oscillator = internal
board_hardware.bod = 2.6v
board_hardware.eesave = yes
upload_protocol = serialupdi
upload_speed = 230400
build_flags = -Wall -Wextra -Iinclude
build_unflags = -w
lib_deps =
    core

[env:attiny3216_debug]
extends = env:attiny3216
build_flags = ${env:attiny3216.build_flags} -DDEBUG_SERIAL

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Iinclude -lm
test_build_src = no
lib_deps =
    core

; Bench-only thermal fault injection (docs/verification/VERIFY.md T5a/T5b). Never flash these into a finished lamp.
[env:bench_t_nack]
extends = env:attiny3216
build_flags = ${env:attiny3216.build_flags} -DDEBUG_SERIAL -DFAULT_T_NACK

[env:bench_t_stuck]
extends = env:attiny3216
build_flags = ${env:attiny3216.build_flags} -DDEBUG_SERIAL -DFAULT_T_STUCK

; Bench-only thermostat path check (VERIFY E17): the MCP9800 trips the LP5012's EN at 30 C, releases at 28 C.
[env:bench_tstat_low]
extends = env:attiny3216
build_flags = ${env:attiny3216.build_flags} -DDEBUG_SERIAL -DTSENSE_TSET_C=30 -DTSENSE_THYST_C=28
